spring.application.name=kintai

# --- DB接続設定 ---
# DockerでPostgreSQLコンテナを起動し、そこに接続する。
# コンテナ名: kintai-postgres、ポート: 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/kintai
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=password

# --- JPA設定 ---
# PostgreSQL用のSQL方言を指定する。JPAはDBの種類に合わせたSQLを生成する。
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# none：JPAはテーブルに一切触らない。テーブル作成はDocker側のinit.sqlで行う。
spring.jpa.hibernate.ddl-auto=none

# --- H2コンソール設定 ---
# PostgreSQLに移行したため無効化。H2使用時は true にするとDBの中身を確認できた。
spring.h2.console.enabled=false

# --- Thymeleaf設定 ---
# false にするとHTMLを変更してアプリを再起動したとき、ブラウザで即反映される。
spring.thymeleaf.cache=false

# --- 初期データ設定 ---
# never：data.sql を実行しない。初期データ投入はDocker側のinit.sqlで行う。
spring.sql.init.mode=never

# --- MyBatis設定 ---
mybatis.mapper-locations=classpath:mappers/*.xml

mybatis.configuration.map-underscore-to-camel-case=true